name: Build WaveBuddy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for the zip
        id: z
        run: |
          if ls *.zip >/dev/null 2>&1; then echo "found=yes" >> "$GITHUB_OUTPUT"; else echo "found=no" >> "$GITHUB_OUTPUT"; echo "No zip in the repo yet. Upload WaveBuddy.zip and this will build."; fi

      - name: Set up Java 17
        if: steps.z.outputs.found == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licences
        if: steps.z.outputs.found == 'yes'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        if: steps.z.outputs.found == 'yes'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the app
        if: steps.z.outputs.found == 'yes'
        run: |
          # unpack oldest zip first, newest last, so the newest files always win
          rm -rf WaveBuddy
          for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | while IFS= read -r line; do
            z="${line#* }"; echo "unpacking $z"; unzip -q -o "$z"
          done
          mkdir -p out
          if [ -f settings.gradle.kts ]; then md=.; else md=WaveBuddy; fi
          mkdir -p "$md/app/src/main/assets"
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip -d mtmp
          rm -rf "$md/app/src/main/assets/model"
          mv mtmp/vosk-model-small-en-us-0.15 "$md/app/src/main/assets/model"
          echo buddy > "$md/app/src/main/assets/model/uuid"
          rm -rf model.zip mtmp
          # the voice-print model for "Only my voice" (the app still builds without it)
          rm -rf "$md/app/src/main/assets/spk"
          if curl -L --fail -o spk.zip https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip && unzip -q spk.zip -d stmp; then
            sd=$(ls -d stmp/*/ | head -1)
            mv "$sd" "$md/app/src/main/assets/spk" || echo "WARNING: could not place the voice-print model"
          else
            echo "WARNING: voice-print model did not download, so Only my voice will be off in this build"
          fi
          rm -rf spk.zip stmp
          if [ -f settings.gradle.kts ]; then d=.; else d=WaveBuddy; fi
          (cd "$d" && gradle assembleDebug --no-daemon 2>&1 | tee ../build.log; st=${PIPESTATUS[0]}; echo "=== ERRORS ==="; grep -E "^e: |error:" ../build.log | head -80; echo "=== END ERRORS ==="; exit $st)
          cp "$d/app/build/outputs/apk/debug/app-debug.apk" out/WaveBuddy.apk
          ls -la out

      - name: Publish a release
        if: steps.z.outputs.found == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WaveBuddy build ${{ github.run_number }}
          files: out/WaveBuddy.apk
