name: Build WaveBuddy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for the zip
        id: z
        run: |
          if ls *.zip >/dev/null 2>&1; then echo "found=yes" >> "$GITHUB_OUTPUT"; else echo "found=no" >> "$GITHUB_OUTPUT"; echo "No zip in the repo yet. Upload WaveBuddy.zip and this will build."; fi

      - name: Set up Java 17
        if: steps.z.outputs.found == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licences
        if: steps.z.outputs.found == 'yes'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        if: steps.z.outputs.found == 'yes'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the app
        if: steps.z.outputs.found == 'yes'
        run: |
          # unpack oldest zip first, newest last, so the newest files always win
          rm -rf WaveBuddy
          for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | while IFS= read -r line; do
            z="${line#* }"; echo "unpacking $z"; unzip -q -o "$z"
          done
          mkdir -p out
          if [ -f settings.gradle.kts ]; then md=.; else md=WaveBuddy; fi
          A="$md/app/src/main/assets"
          J="$md/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$A/model" "$A/spk" "$A/asr"
          mkdir -p "$A/asr" "$A/kws" "$J"
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download
          echo "== engine library =="
          curl -L --fail -o lib.tar.bz2 $R/v2.0.1/sherpa-onnx-v2.0.1-android.tar.bz2
          tar xjf lib.tar.bz2 ./jniLibs/arm64-v8a
          cp jniLibs/arm64-v8a/*.so "$J/"
          echo "== speech engine (Parakeet) =="
          curl -L --fail -o asr.tar.bz2 $R/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2
          tar xjf asr.tar.bz2
          P=sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          ls -la $P
          cp $P/encoder.int8.onnx $P/decoder.int8.onnx $P/joiner.int8.onnx $P/tokens.txt "$A/asr/"
          echo "== wake word =="
          curl -L --fail -o kws.tar.bz2 $R/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar xjf kws.tar.bz2
          K=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          cp $K/*.int8.onnx $K/tokens.txt "$A/kws/"
          echo "== voice detector and voice-print =="
          curl -L --fail -o "$A/silero_vad.onnx" $R/asr-models/silero_vad.onnx
          curl -L --fail -o "$A/speaker.onnx" $R/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx
          rm -rf lib.tar.bz2 asr.tar.bz2 kws.tar.bz2 jniLibs $P $K
          ls -la "$A" "$A/asr" "$A/kws" "$J"
          if [ -f settings.gradle.kts ]; then d=.; else d=WaveBuddy; fi
          (cd "$d" && gradle assembleDebug --no-daemon 2>&1 | tee ../build.log; st=${PIPESTATUS[0]}; echo "=== ERRORS ==="; grep -E "^e: |error:" ../build.log | head -80; echo "=== END ERRORS ==="; exit $st)
          cp "$d/app/build/outputs/apk/debug/app-debug.apk" out/WaveBuddy.apk
          ls -la out

      - name: Publish a release
        if: steps.z.outputs.found == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WaveBuddy build ${{ github.run_number }}
          files: out/WaveBuddy.apk
